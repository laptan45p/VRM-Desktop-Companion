name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  windows-tts-helpers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check beginner TTS scripts without downloads or GPU inference
        shell: powershell
        run: |
          ./test/irodori-setup.Tests.ps1
          ./test/ollama-setup.Tests.ps1

